<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="side">
      <div class="top">
        <h1>Notes</h1>
        <button class="btn" id="theme" aria-label="Toggle dark mode">Theme</button>
        <button class="btn primary" id="new">New note</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search notes" aria-label="Search notes">
      <ul class="list" id="list"></ul>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <script src="script.js"></script>
</body>
</html>
